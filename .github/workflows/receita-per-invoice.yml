name: Receita per-invoice SQLite benchmark
on:
  workflow_dispatch:
    inputs:
      rows:
        description: Synthetic invoices (1–10000000)
        default: '10000000'
        required: true
        type: string
      workers:
        description: In-process calculation workers (1–16)
        default: '4'
        required: true
        type: string
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      RTC_BENCH_WORKERS: ${{ inputs.workers }}
      RTC_ROWS: ${{ inputs.rows }}
      SERVER_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare pinned upstream and synthetic SQLite inputs (not timed)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p report
          {
            uname -a
            lscpu
            free -h
            df -Th "$RUNNER_TEMP"
            java -version
            python3 --version
            python3 -c 'import sqlite3; print("Python SQLite",sqlite3.sqlite_version)'
            printf 'Demo source: %s\n' "$GITHUB_SHA"
          } >report/environment.txt 2>&1
          git clone --filter=blob:none --no-checkout https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git "$RUNNER_TEMP/official-rtc"
          cd "$RUNNER_TEMP/official-rtc"
          git checkout --detach f1eebd7ce3157423b1a6aaca7dc1d6c3395452c4
          mkdir -p calculadora/db src/main/java/benchmark
          cp "$GITHUB_WORKSPACE/receita/benchmark/Bench.java" src/main/java/benchmark/
          ./mvnw --batch-mode flyway:migrate -Dflyway.configFiles=./flyway/flyway-pro.conf
          ./mvnw --batch-mode -DskipTests compile
          python3 "$GITHUB_WORKSPACE/receita/benchmark/dataset.py" prepare "$RUNNER_TEMP/invoices.sqlite" --rows "$RTC_ROWS" | tee "$GITHUB_WORKSPACE/report/generation.json"
      - name: Read, independently calculate, and persist every row
        shell: bash
        run: |
          set -euxo pipefail
          export RTC_BENCH_DB="$RUNNER_TEMP/invoices.sqlite"
          cd "$RUNNER_TEMP/official-rtc"
          SERVER_PORT=18929 ./mvnw --batch-mode spring-boot:run \
            -Dspring-boot.run.main-class=benchmark.Bench -Dspring-boot.run.profiles=offline \
            '-Dspring-boot.run.jvmArguments=-Xmx2g -Dspring.devtools.restart.enabled=false' \
            | tee "$GITHUB_WORKSPACE/report/benchmark.log"
          sed -n 's/^RTC_BENCH //p' "$GITHUB_WORKSPACE/report/benchmark.log" > "$GITHUB_WORKSPACE/report/benchmark.json"
          python3 -c 'import json,os,sys; r=json.load(open(sys.argv[1])); assert r["start_row"]==0 and r["last_row"]==r["rows"]==int(os.environ["RTC_ROWS"]) and r["errors"]==0, r' "$GITHUB_WORKSPACE/report/benchmark.json"
      - name: Verify completeness, SQLite integrity and official REST sample parity (not timed)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/official-rtc"
          SERVER_PORT=18927 ./mvnw --batch-mode spring-boot:run \
            -Dspring-boot.run.main-class=br.gov.serpro.rtc.CalculadoraTributoApplication \
            -Dspring-boot.run.profiles=offline >"$GITHUB_WORKSPACE/report/reference-server.log" 2>&1 &
          ref=$!
          trap 'kill "$ref" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..120}; do
            if curl --fail --silent http://127.0.0.1:18927/api/calculadora/dados-abertos/versao > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          python3 "$GITHUB_WORKSPACE/receita/benchmark/dataset.py" verify "$RUNNER_TEMP/invoices.sqlite" --rows "$RTC_ROWS" | tee "$GITHUB_WORKSPACE/report/verification.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receita-per-invoice-report
          path: report/
